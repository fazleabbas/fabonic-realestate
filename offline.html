<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — FIS Real Estate</title>
    <meta name="theme-color" content="#1a6b4a">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-container {
            text-align: center;
            max-width: 440px;
            padding: 2rem;
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e8f5ee, #dbeafe);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a6b4a;
            margin-bottom: 0.75rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn-retry {
            display: inline-block;
            padding: 0.6rem 1.8rem;
            background: #1a6b4a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-retry:hover { background: #155a3e; }
        .cached-hint {
            margin-top: 2rem;
            padding: 1rem;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            font-size: 0.85rem;
            color: #888;
        }
        .cached-hint strong { color: #1a6b4a; }
        .pending-count {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #e8a838;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="offline-container">
    <div class="offline-icon">&#x1F4F6;</div>
    <h1>You're Offline</h1>
    <p>
        This page isn't available offline. Check your internet connection and try again.
        Any data you've recently viewed may still be accessible.
    </p>
    <button class="btn-retry" onclick="window.location.reload()">Try Again</button>
    <div id="pendingInfo" class="pending-count" style="display:none;"></div>
    <div class="cached-hint">
        <strong>Tip:</strong> Previously visited pages are cached automatically.
        Visit the dashboard while online to cache it for offline use.
    </div>
</div>
<script>
// Show pending sync count if any
if ('indexedDB' in window) {
    try {
        const req = indexedDB.open('FIS_RE_DB');
        req.onsuccess = function() {
            const db = req.result;
            if (db.objectStoreNames.contains('sync_queue')) {
                const tx = db.transaction('sync_queue', 'readonly');
                const count = tx.objectStore('sync_queue').count();
                count.onsuccess = function() {
                    if (count.result > 0) {
                        document.getElementById('pendingInfo').style.display = 'block';
                        document.getElementById('pendingInfo').textContent =
                            count.result + ' pending change(s) will sync when you\'re back online.';
                    }
                };
            }
            db.close();
        };
    } catch(e) {}
}
</script>
</body>
</html>
